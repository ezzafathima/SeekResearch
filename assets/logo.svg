  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    ngo for <tspan fill="#2563EB">edu</tspan>
  </text>
  <text x="100" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#059669" letter-spacing="1.2">
