<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none" role="img" aria-label="Illustration of school backpack, notebooks, books, and educational supplies with gentle sunshine">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="60%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bookGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background organic soft shapes -->
  <rect width="600" height="500" rx="32" fill="url(#skyGrad)" />

  <!-- Subtle decorative background floating sparkles & circles -->
  <circle cx="90" cy="90" r="45" fill="#FEF3C7" opacity="0.8" />
  <circle cx="510" cy="110" r="35" fill="#ECFDF5" />
  <circle cx="480" cy="380" r="60" fill="#DBEAFE" opacity="0.6" />
  <circle cx="80" cy="390" r="50" fill="#FEF3C7" opacity="0.5" />

  <!-- Kerala coconut palm/tropical foliage accent on the side -->
  <path d="M520 280 C540 240 570 230 590 235 C570 255 560 285 545 320 Z" fill="#10B981" opacity="0.3" />
  <path d="M530 310 C560 290 595 300 610 320 C585 330 565 350 540 360 Z" fill="#059669" opacity="0.25" />

  <!-- Base Desk / Ground plane shadow -->
  <ellipse cx="300" cy="430" rx="220" ry="24" fill="#CBD5E1" opacity="0.45" />

  <!-- Stack of Books on the Left -->
  <g transform="translate(100, 260)" filter="url(#softShadow)">
    <!-- Bottom big book (Kerala green) -->
    <rect x="0" y="90" width="150" height="32" rx="6" fill="url(#bookGrad1)" />
    <rect x="14" y="94" width="132" height="24" rx="3" fill="#FFFFFF" />
    <line x1="20" y1="102" x2="140" y2="102" stroke="#E2E8F0" stroke-width="2" />
    <line x1="20" y1="108" x2="135" y2="108" stroke="#E2E8F0" stroke-width="2" />
    <rect x="4" y="90" width="18" height="32" rx="4" fill="#047857" />
    <!-- Gold ribbon bookmark -->
    <path d="M120 90 L120 130 L126 124 L132 130 L132 90 Z" fill="#F59E0B" />

    <!-- Middle book (Blue) -->
    <rect x="15" y="60" width="130" height="28" rx="5" fill="url(#bookGrad2)" />
    <rect x="25" y="64" width="116" height="20" rx="3" fill="#F8FAFC" />
    <line x1="30" y1="72" x2="135" y2="72" stroke="#E2E8F0" stroke-width="2" />
    <rect x="15" y="60" width="15" height="28" rx="3" fill="#1E40AF" />

    <!-- Top notebook (Sunny Amber) -->
    <rect x="25" y="32" width="110" height="26" rx="5" fill="#F59E0B" />
    <rect x="33" y="36" width="98" height="18" rx="3" fill="#FFFBEB" />
    <!-- Spiral binding rings -->
    <circle cx="36" cy="45" r="3" fill="#0F172A" opacity="0.3" />
    <circle cx="48" cy="45" r="3" fill="#0F172A" opacity="0.3" />
    <circle cx="60" cy="45" r="3" fill="#0F172A" opacity="0.3" />
    <circle cx="72" cy="45" r="3" fill="#0F172A" opacity="0.3" />

    <!-- Pencil resting on top -->
    <g transform="translate(45, 10) rotate(-12)">
      <rect x="0" y="0" width="75" height="10" rx="2" fill="#EF4444" />
      <polygon points="75,0 90,5 75,10" fill="#FDE68A" />
      <polygon points="85,3 90,5 85,7" fill="#1E293B" />
      <rect x="0" y="0" width="12" height="10" rx="1" fill="#94A3B8" />
      <rect x="-6" y="0" width="6" height="10" rx="2" fill="#F472B6" />
    </g>
  </g>

  <!-- Central School Backpack (Blue & Warm Amber) -->
  <g transform="translate(230, 110)" filter="url(#softShadow)">
    <!-- Backpack Top Handle -->
    <path d="M55 45 C55 10, 115 10, 115 45" fill="none" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round" />
    <path d="M58 45 C58 16, 112 16, 112 45" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />

    <!-- Backpack Main Body -->
    <path d="M25 60 C25 35, 145 35, 145 60 L155 270 C155 295, 15 295, 15 270 Z" fill="url(#bagGrad)" />

    <!-- Top Zip flap -->
    <path d="M30 65 C40 45, 130 45, 140 65 C140 85, 30 85, 30 65 Z" fill="#1E40AF" />
    <line x1="45" y1="65" x2="125" y2="65" stroke="#93C5FD" stroke-width="3" stroke-dasharray="4 3" />

    <!-- Front Big Pocket (Warm Golden Amber) -->
    <rect x="35" y="145" width="100" height="105" rx="16" fill="url(#pocketGrad)" />
    <!-- Pocket flap -->
    <path d="M35 155 C35 140, 135 140, 135 155 L135 175 L35 175 Z" fill="#D97706" />
    <!-- Reflective Safety Stripe on pocket -->
    <rect x="45" y="195" width="80" height="8" rx="4" fill="#FEF3C7" />
    <!-- Friendly smiling badge/emblem on pocket -->
    <circle cx="85" cy="225" r="12" fill="#FFFFFF" />
    <path d="M79 224 C81 228, 89 228, 91 224" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="81" cy="220" r="1.5" fill="#059669" />
    <circle cx="89" cy="220" r="1.5" fill="#059669" />

    <!-- Side Bottle Pocket (Right) -->
    <rect x="145" y="170" width="22" height="70" rx="8" fill="#1D4ED8" />
    <!-- Water Bottle popping out -->
    <rect x="147" y="130" width="18" height="50" rx="6" fill="#10B981" />
    <rect x="151" y="120" width="10" height="12" rx="3" fill="#047857" />

    <!-- Ruler sticking out of top pocket -->
    <g transform="translate(115, 25) rotate(18)">
      <rect x="0" y="0" width="18" height="70" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="0" y1="12" x2="8" y2="12" stroke="#B45309" stroke-width="1.5" />
      <line x1="0" y1="22" x2="12" y2="22" stroke="#B45309" stroke-width="1.5" />
      <line x1="0" y1="32" x2="8" y2="32" stroke="#B45309" stroke-width="1.5" />
      <line x1="0" y1="42" x2="12" y2="42" stroke="#B45309" stroke-width="1.5" />
      <line x1="0" y1="52" x2="8" y2="52" stroke="#B45309" stroke-width="1.5" />
    </g>
  </g>

  <!-- Stationary Cup & Art Supplies on the Right -->
  <g transform="translate(410, 270)" filter="url(#softShadow)">
    <!-- Pen Stand Cup -->
    <path d="M20 50 L28 120 C29 125, 65 125, 66 120 L74 50 Z" fill="#10B981" />
    <ellipse cx="47" cy="50" rx="27" ry="8" fill="#059669" />

    <!-- Colored Pencils / Brushes sticking out -->
    <!-- Yellow pencil -->
    <rect x="30" y="8" width="7" height="45" fill="#FBBF24" />
    <polygon points="30,8 37,8 33.5,0" fill="#F59E0B" />

    <!-- Blue pen -->
    <rect x="42" y="-4" width="8" height="58" rx="2" fill="#2563EB" />
    <rect x="44" y="-8" width="4" height="6" fill="#1E40AF" />

    <!-- Red paintbrush -->
    <rect x="54" y="4" width="6" height="50" fill="#92400E" />
    <rect x="53" y="-6" width="8" height="12" fill="#94A3B8" />
    <path d="M53 -6 C53 -14, 61 -14, 61 -6 Z" fill="#EF4444" />

    <!-- Geometry Compass / Set square in front -->
    <polygon points="12,125 50,125 50,75" fill="#60A5FA" opacity="0.6" stroke="#2563EB" stroke-width="1.5" />
    <polygon points="22,120 44,120 44,92" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- Floating Warm Trust & Impact Badges -->
  <g transform="translate(390, 80)" filter="url(#softShadow)">
    <rect x="0" y="0" width="170" height="54" rx="27" fill="#FFFFFF" />
    <circle cx="28" cy="27" r="18" fill="#ECFDF5" />
    <path d="M22 27 L26 31 L34 22" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="56" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Kerala Children</text>
    <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#059669">100% Supplies Direct</text>
  </g>

  <g transform="translate(45, 170)" filter="url(#softShadow)">
    <rect x="0" y="0" width="165" height="54" rx="27" fill="#FFFFFF" />
    <circle cx="28" cy="27" r="18" fill="#FEF3C7" />
    <path d="M28 17 L29 23 L35 24 L30 28 L32 34 L28 30 L24 34 L26 28 L21 24 L27 23 Z" fill="#F59E0B" />
    <text x="54" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Community First</text>
    <text x="54" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#D97706">Transparent & Verified</text>
  </g>
</svg>
